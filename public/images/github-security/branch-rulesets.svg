<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8; }
      .header-bg { fill: #0d1117; stroke: #21262d; stroke-width: 1; }
      .text-title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .text-desc { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
      .text-code { fill: #58a6ff; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .badge-green { fill: #238636; rx: 4; }
      .badge-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 600; }
      .toggle-on-bg { fill: #1f6feb; rx: 10; }
      .toggle-knob { fill: #ffffff; }
      .checkbox-checked { fill: #1f6feb; stroke: #1f6feb; rx: 4; }
      .check-mark { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" class="bg" rx="12"/>

  <!-- Top GitHub Breadcrumb Bar -->
  <rect x="0" y="0" width="1000" height="56" class="header-bg" rx="12"/>
  <circle cx="30" cy="28" r="6" fill="#f85149"/>
  <circle cx="50" cy="28" r="6" fill="#d29922"/>
  <circle cx="70" cy="28" r="6" fill="#2ea043"/>

  <text x="105" y="33" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="13">mi-primer-proyecto</text>
  <text x="245" y="33" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="13">/</text>
  <text x="260" y="33" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Settings</text>
  <text x="320" y="33" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="13">/</text>
  <text x="335" y="33" fill="#58a6ff" font-family="-apple-system, sans-serif" font-size="13">Rulesets</text>

  <!-- Page Header -->
  <text x="40" y="95" class="text-title" font-size="20">Branch ruleset: Proteccion de rama main</text>
  <text x="40" y="118" class="text-desc">Enforcement status:</text>
  <rect x="165" y="105" width="58" height="20" class="badge-green"/>
  <text x="175" y="119" class="badge-text">Active</text>

  <!-- Target branches section -->
  <rect x="40" y="140" width="920" height="74" class="card"/>
  <text x="60" y="168" class="text-title">Target branches</text>
  <text x="60" y="192" class="text-desc">Aplica a la rama por defecto del repositorio</text>
  <rect x="760" y="158" width="180" height="34" fill="#21262d" stroke="#30363d" stroke-width="1" rx="6"/>
  <circle cx="780" cy="175" r="5" fill="#3fb950"/>
  <text x="795" y="180" class="text-code">default branch (main)</text>

  <!-- Rules Card -->
  <rect x="40" y="230" width="920" height="360" class="card"/>

  <!-- Rule 1: Restrict deletions -->
  <g transform="translate(60, 255)">
    <rect x="0" y="0" width="20" height="20" class="checkbox-checked"/>
    <path d="M5 10 L8 14 L15 6" class="check-mark"/>
    <text x="35" y="15" class="text-title">Restrict deletions</text>
    <text x="35" y="35" class="text-desc">Impide que cualquier usuario borre la rama principal accidental o deliberadamente.</text>
  </g>

  <!-- Rule 2: Block force pushes -->
  <g transform="translate(60, 315)">
    <rect x="0" y="0" width="20" height="20" class="checkbox-checked"/>
    <path d="M5 10 L8 14 L15 6" class="check-mark"/>
    <text x="35" y="15" class="text-title">Block force pushes</text>
    <text x="35" y="35" class="text-desc">Bloquea comandos destructivos como <tspan class="text-code">git push --force</tspan> que sobreescriben el historial.</text>
  </g>

  <!-- Rule 3: Require Pull Request before merging -->
  <g transform="translate(60, 375)">
    <rect x="0" y="0" width="20" height="20" class="checkbox-checked"/>
    <path d="M5 10 L8 14 L15 6" class="check-mark"/>
    <text x="35" y="15" class="text-title">Require a pull request before merging</text>
    <text x="35" y="35" class="text-desc">Obliga a que todos los cambios pasen por un Pull Request formal antes de ser incorporados a main.</text>

    <!-- Sub-options inside PR rule -->
    <g transform="translate(35, 52)">
      <rect x="0" y="0" width="820" height="120" fill="#0d1117" stroke="#21262d" stroke-width="1" rx="6"/>

      <!-- Required approvals -->
      <text x="20" y="32" class="text-title" font-size="13">Required approvals:</text>
      <rect x="170" y="16" width="50" height="26" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4"/>
      <text x="190" y="33" class="text-title" font-size="13">1</text>
      <text x="235" y="32" class="text-desc">Se requiere al menos 1 revision y aprobacion de un companero.</text>

      <!-- Dismiss stale approvals -->
      <rect x="20" y="55" width="16" height="16" class="checkbox-checked"/>
      <path d="M24 63 L26 66 L32 59" class="check-mark"/>
      <text x="45" y="68" class="text-desc">Descartar aprobaciones previas si se envian nuevos commits al Pull Request.</text>

      <!-- Require review from Code Owners -->
      <rect x="20" y="85" width="16" height="16" class="checkbox-checked"/>
      <path d="M24 93 L26 96 L32 89" class="check-mark"/>
      <text x="45" y="98" class="text-desc">Exigir aprobacion obligatoria de los duenos del codigo definidos en <tspan class="text-code">CODEOWNERS</tspan>.</text>
    </g>
  </g>
</svg>