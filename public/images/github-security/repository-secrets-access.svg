<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8; }
      .header-bg { fill: #0d1117; stroke: #21262d; stroke-width: 1; }
      .text-title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .text-desc { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
      .text-code { fill: #58a6ff; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .badge-secret { fill: #21262d; stroke: #30363d; stroke-width: 1; rx: 4; }
      .btn-green { fill: #238636; rx: 6; }
      .btn-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; }
      .input-box { fill: #010409; stroke: #30363d; stroke-width: 1; rx: 6; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" class="bg" rx="12"/>

  <!-- Top GitHub Breadcrumb Bar -->
  <rect x="0" y="0" width="1000" height="56" class="header-bg" rx="12"/>
  <circle cx="30" cy="28" r="6" fill="#f85149"/>
  <circle cx="50" cy="28" r="6" fill="#d29922"/>
  <circle cx="70" cy="28" r="6" fill="#2ea043"/>

  <text x="105" y="33" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="13">mi-primer-proyecto</text>
  <text x="245" y="33" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="13">/</text>
  <text x="260" y="33" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Settings</text>
  <text x="320" y="33" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="13">/</text>
  <text x="335" y="33" fill="#58a6ff" font-family="-apple-system, sans-serif" font-size="13">Secrets and variables</text>

  <!-- Title -->
  <text x="40" y="95" class="text-title" font-size="20">Actions Secrets &amp; Control de Acceso de Colaboradores</text>
  <text x="40" y="118" class="text-desc">Almacena variables sensibles cifradas que solo tus flujos de CI/CD podran leer, sin exponerlas jamas en el codigo fuente.</text>

  <!-- Section 1: Secrets Form Simulation -->
  <rect x="40" y="140" width="540" height="235" class="card"/>
  <g transform="translate(60, 160)">
    <text x="0" y="16" class="text-title">New repository secret</text>
    <text x="0" y="36" class="text-desc">Los secretos se cifran con libsodium y nunca se muestran tras guardarse.</text>

    <text x="0" y="65" class="text-desc" font-weight="600">Name *</text>
    <rect x="0" y="75" width="500" height="32" class="input-box"/>
    <text x="12" y="96" class="text-code">OPENAI_API_KEY</text>

    <text x="0" y="130" class="text-desc" font-weight="600">Secret *</text>
    <rect x="0" y="140" width="500" height="34" class="input-box"/>
    <text x="12" y="161" fill="#8b949e" font-family="ui-monospace, monospace" font-size="13">&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text>

    <rect x="0" y="185" width="120" height="30" class="btn-green"/>
    <text x="18" y="204" class="btn-text">Add secret</text>
  </g>

  <!-- Section 2: Repository Secrets List -->
  <rect x="600" y="140" width="360" height="235" class="card"/>
  <g transform="translate(620, 160)">
    <text x="0" y="16" class="text-title">Repository secrets (3)</text>
    <text x="0" y="36" class="text-desc">Disponibles en <tspan class="text-code">${{ secrets.NOMBRE }}</tspan></text>

    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="320" height="42" fill="#0d1117" stroke="#21262d" stroke-width="1" rx="6"/>
      <text x="12" y="22" class="text-code">AWS_SECRET_ACCESS_KEY</text>
      <text x="12" y="35" class="text-desc" font-size="10">Actualizado hace 2 dias</text>
    </g>

    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="320" height="42" fill="#0d1117" stroke="#21262d" stroke-width="1" rx="6"/>
      <text x="12" y="22" class="text-code">DATABASE_URL</text>
      <text x="12" y="35" class="text-desc" font-size="10">Actualizado hace 1 semana</text>
    </g>

    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="320" height="42" fill="#0d1117" stroke="#21262d" stroke-width="1" rx="6"/>
      <text x="12" y="22" class="text-code">STRIPE_WEBHOOK_SECRET</text>
      <text x="12" y="35" class="text-desc" font-size="10">Actualizado ayer</text>
    </g>
  </g>

  <!-- Section 3: Collaborators & Permissions Matrix -->
  <rect x="40" y="390" width="920" height="205" class="card"/>
  <g transform="translate(60, 415)">
    <text x="0" y="16" class="text-title">Matriz de Roles y Principio de Menor Privilegio (Collaborators &amp; Teams)</text>
    <text x="0" y="36" class="text-desc">Asigna el rol justo y necesario a cada miembro del equipo para evitar errores destructivos en produccion:</text>

    <!-- Table Header -->
    <rect x="0" y="55" width="880" height="28" fill="#21262d" rx="4"/>
    <text x="15" y="73" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">ROL</text>
    <text x="120" y="73" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PERMISOS CLAVE</text>
    <text x="490" y="73" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">CUANDO ASIGNARLO</text>

    <!-- Row 1: Read -->
    <text x="15" y="105" class="text-code">Read</text>
    <text x="120" y="105" class="text-desc">Clonar, ver codigo, reportar issues y sugerir PRs.</text>
    <text x="490" y="105" class="text-desc">Auditorias externas, stakeholders o nuevos integrantes.</text>

    <!-- Row 2: Write -->
    <text x="15" y="130" class="text-code">Write</text>
    <text x="120" y="130" class="text-desc">Crear ramas, hacer commits y abrir Pull Requests.</text>
    <text x="490" y="130" class="text-desc">Desarrolladores activos del equipo en el dia a dia.</text>

    <!-- Row 3: Maintain -->
    <text x="15" y="155" class="text-code">Maintain</text>
    <text x="120" y="155" class="text-desc">Gestionar issues, PRs y settings sin acceso a secretos.</text>
    <text x="490" y="155" class="text-desc">Tech leads y moderadores de repositorios.</text>

    <!-- Row 4: Admin -->
    <text x="15" y="180" class="text-alert" font-weight="700">Admin</text>
    <text x="120" y="180" class="text-desc">Control total, configuracion de seguridad, secretos y borrado.</text>
    <text x="490" y="180" class="text-desc">Exclusivo para lideres de infraestructura o duenos del repo.</text>
  </g>
</svg>