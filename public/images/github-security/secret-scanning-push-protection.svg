<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8; }
      .header-bg { fill: #0d1117; stroke: #21262d; stroke-width: 1; }
      .text-title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .text-desc { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
      .text-code { fill: #58a6ff; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .text-alert { fill: #f85149; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; }
      .text-warn { fill: #d29922; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; }
      .badge-green { fill: #238636; rx: 4; }
      .badge-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 600; }
      .btn-enabled { fill: #238636; rx: 6; }
      .btn-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 600; }
      .terminal-bg { fill: #010409; stroke: #f85149; stroke-width: 1.5; rx: 8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="640" class="bg" rx="12"/>

  <!-- Top GitHub Breadcrumb Bar -->
  <rect x="0" y="0" width="1000" height="56" class="header-bg" rx="12"/>
  <circle cx="30" cy="28" r="6" fill="#f85149"/>
  <circle cx="50" cy="28" r="6" fill="#d29922"/>
  <circle cx="70" cy="28" r="6" fill="#2ea043"/>

  <text x="105" y="33" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="13">mi-primer-proyecto</text>
  <text x="245" y="33" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="13">/</text>
  <text x="260" y="33" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Settings</text>
  <text x="320" y="33" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="13">/</text>
  <text x="335" y="33" fill="#58a6ff" font-family="-apple-system, sans-serif" font-size="13">Code security and analysis</text>

  <!-- Title -->
  <text x="40" y="95" class="text-title" font-size="20">Secret scanning &amp; Push protection</text>
  <text x="40" y="118" class="text-desc">Protege tu repositorio contra la filtracion accidental de credenciales, claves de API y tokens de proveedores cloud.</text>

  <!-- Feature 1: Secret scanning -->
  <rect x="40" y="140" width="920" height="90" class="card"/>
  <g transform="translate(60, 160)">
    <text x="0" y="18" class="text-title">Secret scanning</text>
    <text x="0" y="40" class="text-desc">GitHub analiza commits pasados y presentes en busqueda de mas de 200 formatos de tokens conocidos (AWS, OpenAI, Stripe, Google Cloud, GitHub PATs).</text>
    <rect x="740" y="12" width="140" height="34" class="btn-enabled"/>
    <text x="765" y="33" class="btn-text">&#10003; Enabled</text>
  </g>

  <!-- Feature 2: Push protection -->
  <rect x="40" y="245" width="920" height="105" class="card" stroke="#1f6feb"/>
  <g transform="translate(60, 265)">
    <rect x="0" y="4" width="10" height="10" fill="#3fb950" rx="2"/>
    <text x="18" y="14" class="text-title" fill="#58a6ff">Push protection</text>
    <text x="18" y="36" class="text-desc">Bloquea en tiempo real cualquier intento de <tspan class="text-code">git push</tspan> si los archivos contienen un secreto no encriptado.</text>
    <text x="18" y="56" class="text-desc" fill="#d29922">&#9888; Si un desarrollador intenta subir un archivo con un token, el push es rechazado antes de entrar al repositorio.</text>
    <rect x="740" y="18" width="140" height="34" class="btn-enabled"/>
    <text x="765" y="39" class="btn-text">&#10003; Enabled</text>
  </g>

  <!-- Terminal Simulation of Rejection -->
  <rect x="40" y="365" width="920" height="245" class="terminal-bg"/>

  <g transform="translate(60, 395)">
    <text x="0" y="0" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11">$ git push origin feature/integracion-api</text>
    <text x="0" y="22" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11">Enumerating objects: 5, done.</text>
    <text x="0" y="44" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11">Writing objects: 100% (5/5), 1.2 KiB | 1.2 MiB/s, done.</text>

    <!-- Error Banner -->
    <text x="0" y="75" class="text-alert" font-weight="700">remote: error: GH013: Repository rule violations found for refs/heads/feature/integracion-api.</text>
    <text x="0" y="98" class="text-alert">remote: </text>
    <text x="0" y="115" class="text-warn" font-weight="700">remote: - PUSH PROTECTION: Secret detected in commit 4b9e1a2</text>
    <text x="0" y="135" class="text-title" font-size="12">remote:   File: src/services/openai.js:14</text>
    <text x="0" y="153" class="text-desc" font-family="ui-monospace, monospace">remote:   Type: OpenAI API Key (sk-proj-****************)</text>
    <text x="0" y="175" class="text-alert">remote: Resolucion: Elimina la clave del archivo, guarda como variable de entorno y haz git commit --amend.</text>
    <text x="0" y="198" fill="#f85149" font-family="ui-monospace, monospace" font-size="12" font-weight="700">! [remote rejected] feature/integracion-api -&gt; feature/integracion-api (push declined due to secret)</text>
  </g>
</svg>