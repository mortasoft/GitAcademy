<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8; }
      .header-bg { fill: #0d1117; stroke: #21262d; stroke-width: 1; }
      .text-title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .text-desc { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
      .text-code { fill: #58a6ff; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .code-box { fill: #010409; stroke: #30363d; stroke-width: 1; rx: 6; }
      .tree-icon { fill: #58a6ff; }
      .tree-file { fill: #c9d1d9; font-family: ui-monospace, monospace; font-size: 12px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" class="bg" rx="12"/>

  <!-- Top GitHub Breadcrumb Bar -->
  <rect x="0" y="0" width="1000" height="56" class="header-bg" rx="12"/>
  <circle cx="30" cy="28" r="6" fill="#f85149"/>
  <circle cx="50" cy="28" r="6" fill="#d29922"/>
  <circle cx="70" cy="28" r="6" fill="#2ea043"/>

  <text x="105" y="33" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="13">mi-primer-proyecto</text>
  <text x="245" y="33" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="13">/</text>
  <text x="260" y="33" fill="#f0f6fc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Governance</text>
  <text x="350" y="33" fill="#6e7681" font-family="-apple-system, sans-serif" font-size="13">/</text>
  <text x="365" y="33" fill="#58a6ff" font-family="-apple-system, sans-serif" font-size="13">CODEOWNERS &amp; SECURITY.md</text>

  <!-- Title -->
  <text x="40" y="95" class="text-title" font-size="20">Archivos Esenciales de Gobernanza y Asignacion Automatica</text>
  <text x="40" y="118" class="text-desc">Estandariza como el equipo interactua con el repositorio, canaliza reportes de seguridad y asigna revisores automaticos por area de codigo.</text>

  <!-- Section 1: File Tree Structure -->
  <rect x="40" y="140" width="340" height="445" class="card"/>
  <g transform="translate(60, 165)">
    <text x="0" y="14" class="text-title">Estructura Estandar .github/</text>
    <text x="0" y="34" class="text-desc">Archivos especiales reconocidos por GitHub:</text>

    <!-- Tree items -->
    <g transform="translate(0, 55)">
      <text x="0" y="15" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="13">&#128194; .github/</text>
      <text x="25" y="40" class="tree-file">&#128196; CODEOWNERS</text>
      <text x="25" y="65" class="tree-file">&#128196; PULL_REQUEST_TEMPLATE.md</text>
      <text x="25" y="90" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="13">&#128194; ISSUE_TEMPLATE/</text>
      <text x="45" y="115" class="tree-file">&#128196; bug_report.md</text>
      <text x="45" y="140" class="tree-file">&#128196; feature_request.md</text>
      <text x="25" y="165" class="tree-file">&#128196; dependabot.yml</text>

      <text x="0" y="200" class="tree-file">&#128196; SECURITY.md</text>
      <text x="0" y="225" class="tree-file">&#128196; README.md</text>
      <text x="0" y="250" class="tree-file">&#128196; LICENSE</text>
      <text x="0" y="275" class="tree-file">&#128196; .gitignore</text>
    </g>
  </g>

  <!-- Section 2: CODEOWNERS Preview -->
  <rect x="400" y="140" width="560" height="235" class="code-box"/>
  <g transform="translate(420, 165)">
    <text x="0" y="12" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11"># .github/CODEOWNERS - Asigna revisores automaticos a cada Pull Request</text>
    <text x="0" y="36" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11"># Regla general: todo el repositorio requiere aprobacion del lead</text>
    <text x="0" y="58" class="text-code">*           <tspan fill="#79c0ff">@tech-lead</tspan></text>

    <text x="0" y="86" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11"># Cambios en la interfaz visual solicitan al equipo frontend</text>
    <text x="0" y="108" class="text-code">/src/components/   <tspan fill="#79c0ff">@org/frontend-core</tspan></text>

    <text x="0" y="136" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11"># Seguridad, autenticacion y base de datos</text>
    <text x="0" y="158" class="text-code">/src/auth/         <tspan fill="#f85149">@security-auditors</tspan></text>
    <text x="0" y="180" class="text-code">/database/         <tspan fill="#d29922">@dba-team</tspan></text>
  </g>

  <!-- Section 3: SECURITY.md Preview -->
  <rect x="400" y="390" width="560" height="195" class="code-box"/>
  <g transform="translate(420, 415)">
    <text x="0" y="12" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11"># SECURITY.md - Politica de Divulgacion Responsable</text>
    <text x="0" y="38" class="text-title" font-size="14">## Reporte de Vulnerabilidades de Seguridad</text>
    <text x="0" y="62" class="text-desc">Por favor, <tspan fill="#f85149" font-weight="700">NO reportes vulnerabilidades en issues publicos</tspan>.</text>
    <text x="0" y="84" class="text-desc">Para reportar un fallo de manera privada y protegida:</text>
    <text x="0" y="106" class="text-code">1. Ve a la pestana "Security" &gt; "Advisories".</text>
    <text x="0" y="126" class="text-code">2. Haz clic en "Report a vulnerability" (divulgacion privada con el equipo).</text>
    <text x="0" y="146" class="text-desc">El equipo de seguridad respondera y asignara un CVE antes de hacer publico el fix.</text>
  </g>
</svg>